name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: AST lint (the watchdog's own check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: core.py compiles
        run: python -m py_compile core.py
      - name: core.py parses (entrypoint watchdog invariant)
        run: python -c "import ast; ast.parse(open('core.py', encoding='utf-8').read())"

  test:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: pytest tests/ -v
